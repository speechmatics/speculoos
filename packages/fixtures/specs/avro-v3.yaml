asyncapi: "3.0.0"
info:
  title: Avro Payloads
  version: "1.0.0"
channels:
  events:
    address: /events
    messages:
      Legacy:
        name: Legacy
        schemaFormat: application/vnd.apache.avro;version=1.9.0
        payload:
          type: record
          name: Legacy
          fields:
            - { name: id, type: string }
      Modern:
        name: Modern
        payload:
          schemaFormat: application/vnd.apache.avro+json;version=1.9.0
          schema:
            type: record
            name: Modern
      Fine:
        name: Fine
        payload:
          schemaFormat: application/vnd.aai.asyncapi+json;version=3.0.0
          schema:
            type: object
            properties:
              ok: { type: boolean }
operations:
  receiveEvents:
    action: receive
    channel:
      $ref: "#/channels/events"
    messages:
      - $ref: "#/channels/events/messages/Legacy"
      - $ref: "#/channels/events/messages/Modern"
      - $ref: "#/channels/events/messages/Fine"
