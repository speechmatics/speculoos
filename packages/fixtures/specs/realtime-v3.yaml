asyncapi: "3.0.0"
info:
  title: Realtime Transcription
  version: "2.0.0"
  description: Stream audio, receive transcripts.
  tags:
    - name: Realtime
      description: The websocket API.
servers:
  production:
    host: eu2.rt.example.com
    pathname: /v2
    protocol: wss
    protocolVersion: "13"
    description: Production endpoint.
    security:
      - $ref: "#/components/securitySchemes/bearer"
channels:
  /v2/{language}:
    address: /v2/{language}
    description: The transcription socket.
    parameters:
      language:
        description: Language of the audio.
    messages:
      StartRecognition:
        $ref: "#/components/messages/StartRecognition"
      AddAudio:
        $ref: "#/components/messages/AddAudio"
      RecognitionStarted:
        $ref: "#/components/messages/RecognitionStarted"
operations:
  sendToServer:
    action: receive
    summary: Messages the client sends.
    tags:
      - name: Realtime
    channel:
      $ref: "#/channels/~1v2~1{language}"
    messages:
      - $ref: "#/channels/~1v2~1{language}/messages/StartRecognition"
      - $ref: "#/channels/~1v2~1{language}/messages/AddAudio"
  receiveFromServer:
    action: send
    summary: Messages the server sends.
    tags:
      - name: Realtime
    channel:
      $ref: "#/channels/~1v2~1{language}"
    messages:
      - $ref: "#/channels/~1v2~1{language}/messages/RecognitionStarted"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A JWT.
  messages:
    StartRecognition:
      name: StartRecognition
      title: Start recognition
      summary: Begin a session.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/StartRecognition"
      examples:
        - name: minimal
          payload:
            message: StartRecognition
    AddAudio:
      name: AddAudio
      summary: A chunk of audio.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/AddAudio"
    RecognitionStarted:
      name: RecognitionStarted
      summary: The session is live.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/RecognitionStarted"
  schemas:
    StartRecognition:
      type: object
      required: [message]
      properties:
        message:
          const: StartRecognition
        transcription_config:
          $ref: "#/components/schemas/TranscriptionConfig"
    AddAudio:
      type: object
      required: [message]
      properties:
        message:
          const: AddAudio
        seq_no:
          type: integer
          minimum: 0
    RecognitionStarted:
      type: object
      required: [message]
      properties:
        message:
          const: RecognitionStarted
        id:
          type: string
          format: uuid
    TranscriptionConfig:
      type: object
      required: [language]
      properties:
        language:
          type: string
          description: ISO 639-1 code.
        operating_point:
          oneOf:
            - const: standard
              description: Faster.
            - const: enhanced
              description: More accurate.
